[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "licenselens"
version = "0.1.0"
description = "Find the licenses that will stop you shipping. Offline-correct license detection and commercial-risk decisions for dependency trees."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "yuehancn" }]
keywords = [
    "license",
    "compliance",
    "spdx",
    "copyleft",
    "sbom",
    "open-source",
    "dependency-audit",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Legal Industry",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Security",
]
dependencies = []

[project.optional-dependencies]
dev = []

[project.scripts]
licenselens = "licenselens.cli:main"

[project.urls]
Homepage = "https://github.com/yuehancn/licenselens"
Issues = "https://github.com/yuehancn/licenselens/issues"
Source = "https://github.com/yuehancn/licenselens"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]