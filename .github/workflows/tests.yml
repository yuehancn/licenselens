name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  selftest:
    name: selftest (${{ matrix.os }}, python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    # The suite takes under 10 seconds. Anything approaching this limit is a
    # stuck runner, not a slow test, so fail fast instead of hanging the run.
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # Linux and Windows are the platforms that must be green. macOS is
        # included but non-blocking: on free runners the macOS queue regularly
        # sits for 15+ minutes and then gets cancelled before a single step
        # runs, which turns the badge red for an infrastructure reason rather
        # than a code one. A cancelled job with steps:[] is not a test failure.
        #
        # 3.10 is the floor because it is the oldest interpreter we still claim
        # to support, and it is the one that exercises the no-tomllib fallback
        # in manifest.py for real instead of through a monkeypatch. 3.14 is the
        # newest, so a future stdlib removal shows up here and not in a user's
        # bug report. Windows stays on 3.13: the prebuilt 3.10 manifest has no
        # win32 build, and this job exists to cover Windows, not 3.10.
        include:
          - os: ubuntu-latest
            python: "3.10"
            required: true
          - os: ubuntu-latest
            python: "3.12"
            required: true
          - os: ubuntu-latest
            python: "3.13"
            required: true
          - os: ubuntu-latest
            python: "3.14"
            required: true
          - os: windows-latest
            python: "3.13"
            required: true
          - os: macos-latest
            python: "3.13"
            required: false
    continue-on-error: ${{ !matrix.required }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      # No dependency install step on purpose. If this ever needs one, the
      # "runs on a locked-down CI runner" promise is broken and the test job
      # should fail to remind us.
      - name: Run the suite
        run: python licenselens.py selftest

  dogfood:
    name: audit this repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Judge our own license
        run: python licenselens.py judge LICENSE --fail-on never

      - name: Scan our own manifests
        run: python licenselens.py scan . --fail-on never

      # Exercise the network channel without letting upstream licensing decide
      # whether CI is green: the point of this step is to prove the HTML channel
      # parses and the reports serialise, not to assert anything about Flask.
      - name: Probe a known repository and emit SARIF
        run: |
          printf 'pallets/flask\n' > repos.txt
          python licenselens.py audit --file repos.txt --format sarif -o licenses.sarif --quiet
        continue-on-error: true

      - name: Check SARIF is valid JSON
        run: python -c "import json;json.load(open('licenses.sarif'));print('sarif ok')"
        continue-on-error: true

      # The policy loader now rejects typos and unsupported YAML, and that
      # rejection is the point of it. This step proves the shipped example still
      # loads - a broken example is the first thing a new user copies.
      - name: Validate the example policy file
        run: python licenselens.py policy examples/policy/acme.policy.yml

      # A misspelled key must fail, and must fail with exit 2 (bad input) rather
      # than 1 (a dependency is blocked). If this step ever passes, the typo
      # guard has regressed and every downstream report is suspect.
      #
      # The file is written from a heredoc rather than a one-liner: MSYS-style
      # shells rewrite the characters in `python -c "...\n..."`, and a mangled
      # fixture would make this step pass or fail for the wrong reason.
      - name: A typo in a policy file must exit 2
        run: |
          python <<'PY'
          open("broken.yml", "w", newline="").write(
              "extends: commercial\nsettings:\n  allow_strong_copyeft: true\n"
          )
          PY
          set +e
          python licenselens.py policy broken.yml
          status=$?
          set -e
          if [ "$status" -ne 2 ]; then
            echo "expected exit 2 for a misspelled key, got $status"
            exit 1
          fi
          echo "typo guard ok (exit 2)"