name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  selftest:
    name: selftest (${{ matrix.os }}, python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    # The suite takes under 10 seconds. Anything approaching this limit is a
    # stuck runner, not a slow test, so fail fast instead of hanging the run.
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # Linux and Windows are the platforms that must be green. macOS is
        # included but non-blocking: on free runners the macOS queue regularly
        # sits for 15+ minutes and then gets cancelled before a single step
        # runs, which turns the badge red for an infrastructure reason rather
        # than a code one. A cancelled job with steps:[] is not a test failure.
        include:
          - os: ubuntu-latest
            python: "3.9"
            required: true
          - os: ubuntu-latest
            python: "3.12"
            required: true
          - os: ubuntu-latest
            python: "3.13"
            required: true
          - os: windows-latest
            python: "3.13"
            required: true
          - os: macos-latest
            python: "3.13"
            required: false
    continue-on-error: ${{ !matrix.required }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      # No dependency install step on purpose. If this ever needs one, the
      # "runs on a locked-down CI runner" promise is broken and the test job
      # should fail to remind us.
      - name: Run the suite
        run: python licenselens.py selftest

  dogfood:
    name: audit this repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Judge our own license
        run: python licenselens.py judge LICENSE --fail-on never

      - name: Scan our own manifests
        run: python licenselens.py scan . --fail-on never

      # Exercise the network channel without letting upstream licensing decide
      # whether CI is green: the point of this step is to prove the HTML channel
      # parses and the reports serialise, not to assert anything about Flask.
      - name: Probe a known repository and emit SARIF
        run: |
          printf 'pallets/flask\n' > repos.txt
          python licenselens.py audit --file repos.txt --format sarif -o licenses.sarif --quiet
        continue-on-error: true

      - name: Check SARIF is valid JSON
        run: python -c "import json;json.load(open('licenses.sarif'));print('sarif ok')"
        continue-on-error: true